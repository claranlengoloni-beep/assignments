<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LushLips - Assignment 4</title>
    
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            /* Background: Anything except white [3 marks] */
            background-color: #fff0f3; 
            margin: 0;
            padding: 40px 20px;
            /* Content Centered [3 marks] */
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1200px;
        }

        /* 5 Containers [5 marks] */
        .product-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(248, 187, 208, 0.3);
            width: 200px;
            text-align: center;
        }

        .product-box img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 18px;
        }
    </style>
</head>
<body>

    <h1 style="color: #ad1457; font-family: 'Georgia', serif; letter-spacing: 2px; margin-bottom: 40px; text-transform: uppercase;">
        LushLips Official Collection
    </h1>

    <div class="gallery-container">
        <div class="product-box">
            <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500" alt="Strawberry Scrub">
            <p style="color: #ad1457; font-weight: bold; margin-top: 10px;">Strawberry Sugar Scrub</p>
        </div>

        <div class="product-box">
            <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500" alt="Shea Balm">
            <p style="color: #ad1457; font-weight: bold; margin-top: 10px;">Organic Shea Balm</p>
        </div>

        <div class="product-box">
            <img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=500" alt="Lip Oil">
            <p style="color: #ad1457; font-weight: bold; margin-top: 10px;">Vegan Lip Oil</p>
        </div>

        <div class="product-box">
            <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500" alt="Rose Tint">
            <p style="color: #ad1457; font-weight: bold; margin-top: 10px;">Rose Tint</p>
        </div>

        <div class="product-box">
            <img src="https://images.unsplash.com/photo-1571781926291-c477ebfd024b?w=500" alt="Honey Mask">
            <p style="color: #ad1457; font-weight: bold; margin-top: 10px;">Honey Mask</p>
        </div>
    </div>

</body>
</html>
